global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mio-ai
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:9090"]
        labels:
          environment: production
