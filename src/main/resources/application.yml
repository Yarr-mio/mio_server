spring:
  application:
    name: mio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    postgresql:
      # CREATE INDEX CONCURRENTLY(V62)가 Flyway 세션 수준 어드바이저리 잠금과 교착하지
      # 않도록 트랜잭션 잠금을 끈다.
      transactional-lock: false



  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true

management:
  # 메인 포트(8080)와 분리한다. Nginx 는 8080 만 프록시하므로 관리 포트는 구조적으로
  # 외부에서 도달할 수 없고, docker-compose.prod.yml 에도 publish 하지 않는다.
  # 메인 포트에 노출하면 admin 롤이 없어 일반 로그인 사용자가 메트릭을 읽게 된다.
  # 스크레이프: docker compose exec app curl -s localhost:9090/actuator/prometheus
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: mio

jwt:
  secret: ${JWT_SECRET}
  expiry-seconds: 900

kakao:
  api-url: ${KAKAO_API_URL:https://kapi.kakao.com}
  app-id: ${KAKAO_APP_ID}

apple:
  jwks-url: ${APPLE_JWKS_URL:https://appleid.apple.com/auth/keys}
  app-id: ${APPLE_APP_ID}

apns:
  key-content: ${APNS_KEY_CONTENT:}
  key-path: ${APNS_KEY_PATH:}
  key-id: ${APNS_KEY_ID:}
  team-id: ${APNS_TEAM_ID:}
  bundle-id: ${APNS_BUNDLE_ID:}
  is-production: ${APNS_IS_PRODUCTION:false}

fcm:
  credentials-json: ${FCM_CREDENTIALS_JSON:}

notification:
  test-endpoint-enabled: false
  cron:
    morning: ${NOTIFICATION_CRON_MORNING:0 0 9 * * *}
    afternoon: ${NOTIFICATION_CRON_AFTERNOON:0 0 12 * * *}
    evening: ${NOTIFICATION_CRON_EVENING:0 0 22 * * *}

openai:
  api-key: ${OPENAI_API_KEY}
  base-url: https://api.openai.com
  # 토큰 100만 개당 USD — OpenAI 가격표와 같은 단위라 값을 그대로 옮길 수 있다.
  # 여기 없는 모델은 비용이 0 이 아니라 '미상'으로 기록되고 mio.llm.cost.unpriced 가 올라간다.
  # 새 모델을 도입하면 여기에 단가를 같이 추가할 것.
  pricing:
    models:
      "[gpt-4o]":
        input: 2.50
        cached-input: 1.25
        output: 10.00
      "[gpt-4o-mini]":
        input: 0.15
        cached-input: 0.075
        output: 0.60
      # 임베딩은 출력 토큰과 캐시 할인이 없다.
      "[text-embedding-3-small]":
        input: 0.02
        output: 0.00

logging:
  level:
    com.mio: INFO

events:
  # 성장분석 이벤트 전용 로그 파일 경로 (이슈 #285). prod는 docker-compose.prod.yml에서
  # /var/log/mio/journey-events.jsonl로 덮어쓴다 — 강민석 인프라 명세 §1 EVENT_FILE 그대로.
  log-file-path: ${EVENTS_LOG_FILE_PATH:./logs/journey-events.jsonl}
  # 이슈 #326 — 거부 이벤트 원본 로그 파일. journey-events와 물리적으로 분리해
  # 정상 지표 집계 파이프라인에 섞여 들어가지 않게 한다.
  rejected-log-file-path: ${EVENTS_REJECTED_LOG_FILE_PATH:./logs/journey-events-rejected.jsonl}
  # 이슈 #322 — 앱 버전 혼재 시 구버전이 영구 소실되는 걸 막기 위해 거부가 아니라
  # 통과+태깅으로 처리한다. 명세 개정 시 [3, 4]로 잠시 병행한다.
  accepted-schema-versions: [3]
  # 이슈 #353 — 검증 기기 anonymous_id 목록. 여기 등록된 값은 journey-events가 아니라
  # journey-events-internal로 격리된다(실사용자 지표 오염 방지). 빈 목록이면 기존과 동일하게
  # 전부 journey-events로 간다 — 실제 검증 기기 값은 필요할 때 채운다.
  internal-anonymous-ids: []
  # journey-events-internal 전용 로그 파일 경로. journey-events/-rejected와 물리적으로 분리한다.
  internal-log-file-path: ${EVENTS_INTERNAL_LOG_FILE_PATH:./logs/journey-events-internal.jsonl}
