# 이슈 #402 — 테스트 컨텍스트에서 프로덕션 스케줄러가 픽스처를 가로채지 못하게 끈다.
# 프로파일을 가리지 않는 보장은 DisableSchedulingContextCustomizerFactory 가 담당하고,
# 여기 선언은 프로파일 단위로도 명시해 두기 위한 것이다.
scheduling:
  enabled: false

# 이슈 #545 — CBT 질문 게이트는 운영 기본 OFF(배포 ≠ 릴리즈)지만, 통합 테스트는 게이트가
# 켜진 상태의 실제 동작을 검증해야 하므로 이 프로파일에서만 켠다.
cbt:
  question-gate:
    enabled: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mio
    username: mio
    password: mio

  flyway:
    validate-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      password: ""

jwt:
  secret: test-secret-key-for-integration-testing-must-be-at-least-256-bits-long!!
  expiry-seconds: 900

kakao:
  api-url: https://kapi.kakao.com
  app-id: 12345

apple:
  jwks-url: https://appleid.apple.com/auth/keys
  app-id: com.test.app

APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
APP_ENCRYPTION_DEK_ID: test-key-v1
APP_BELIEF_IDENTITY_HMAC_KEY: test-belief-identity-hmac-key-at-least-32-bytes
