services:
  app:
    image: ghcr.io/yarr-mio/mio_server:latest
    restart: unless-stopped
    # 상한은 예약이 아니라 보호 장치다. 상한이 없으면 메모리를 폭주시킨 컨테이너를
    # cgroup 이 막지 못해 호스트 전체가 페이지 캐시 스래싱에 빠진다(2026-08-07 장애).
    # 당시 커널은 회수 가능한 캐시가 남아 있다고 보아 OOM Killer 를 발동하지 않았고,
    # 컨테이너가 죽지 않아 restart 정책도 작동하지 못했다.
    # t4g.small(1841MB) 실사용 381MB 기준. JVM MaxRAMPercentage=55 와 짝을 이룬다.
    mem_limit: 800m
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 이슈 #285 — 강민석 인프라 명세 §1 EVENT_FILE 그대로. 컨테이너 안에서만 쓰면 호스트의
      # CloudWatch Agent가 못 읽으므로 아래 volumes로 호스트 경로에 마운트한다.
      EVENTS_LOG_FILE_PATH: /var/log/mio/journey-events.jsonl
      # 이슈 #326 — 거부 이벤트 원본 로그. 같은 /var/log/mio 볼륨에 남기고, CloudWatch
      # Agent 설정에 별도 로그 그룹으로 추가하는 건 이 PR과 분리된 인프라 작업이다.
      EVENTS_REJECTED_LOG_FILE_PATH: /var/log/mio/journey-events-rejected.jsonl
      # 이슈 #353 — 위와 동일한 이유. 이 오버라이드가 빠지면 컨테이너 안에서 상대경로
      # (./logs/journey-events-internal.jsonl)로 열리는데 그 디렉터리가 없어 logback이
      # 기동 자체를 실패시킨다(2026-08-06 프로덕션 장애 원인).
      EVENTS_INTERNAL_LOG_FILE_PATH: /var/log/mio/journey-events-internal.jsonl
    volumes:
      # 호스트에 /var/log/mio 디렉터리·권한이 먼저 준비돼 있어야 한다
      # (강민석 인프라 명세 §4-B: mkdir + 앱 실행 유저 소유 + cwagent 그룹 추가).
      - /var/log/mio:/var/log/mio
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /mio/app
        # awslogs-stream-prefix: EC2(mio_backend)의 Docker 엔진이 "unknown log opt"로 거부해
        # 컨테이너 생성 자체가 실패했다(#309, 2026-08-05 배포 장애) — 스트림 이름을 보기 좋게
        # 만드는 optional 필드일 뿐이라 제거. 없어도 CloudWatch 전송 자체엔 영향 없음.
        # 로그 그룹이 미리 없으면 자동 생성 — 이미 있으면 무해한 no-op.
        # 보존기간(30일)은 aws logs put-retention-policy로 별도 설정 필요 (자동 생성 시 기본이 무기한 보관).
        awslogs-create-group: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # 실사용 57MB. shared_buffers 128MB + HikariCP 풀(20) x work_mem 4MB 를
    # 고려해 320m. maxmemory 정책이 아니라 폭주 차단용 상한이다.
    mem_limit: 320m
    environment:
      POSTGRES_DB: ${DB_NAME:-mio}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-mio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 실사용 11MB. 세션 버퍼가 예상 밖으로 커지는 경우를 막는 상한이다.
    # redis 자체의 maxmemory/eviction 정책 도입은 별건으로 둔다.
    mem_limit: 128m
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
